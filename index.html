<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

        <div class="container">

        <!-- App header and temperature unit button -->
        <header>
            <h1>WeatherNow</h1>
            <button id="unitButton">Switch to °F</button>
        </header>
        <!-- Search form for finding a city -->
        <form id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter a city, e.g. Nairobi"
                autocomplete="off"
                required
            >
            <button type="submit">Search</button>
        </form>

        <!-- Previous searches will appear here -->
        <div id="history" class="history"></div>
        <button id="clearHistory" class="clear-button" type="button">
            Clear History
        </button>

        <!-- Loading and error messages -->
        <p id="message" role="status" aria-live="polite"></p>

                <!-- Current weather information -->
        <section id="weatherCard" class="weather-card" hidden>
            <h2 id="cityName">City</h2>
            <p id="dateTime"></p>

            <div class="temperature-area">
                <img id="weatherIcon" src="" alt="Weather icon">
                <p id="temperature">--°C</p>
            </div>

            <p id="condition">Weather condition</p>
            <p id="feelsLike">Feels like: --</p>

            <div class="weather-details">
                <p>Humidity: <span id="humidity">--</span>%</p>
                <p>Wind: <span id="wind">--</span> m/s</p>
                <p>Pressure: <span id="pressure">--</span> hPa</p>
            </div>
        </section>

    <script src="js/app.js"></script>
</body>
</html>
